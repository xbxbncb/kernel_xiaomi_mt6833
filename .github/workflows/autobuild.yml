name: Auto Kernel Builer
on:
   push:
      branches: [main,ksunext,ksunext-susfs]
   workflow_dispatch:
      inputs:
         ksuversion:
            description: "请输入 KernelSU Next 的版本号"
            required: true
            default: "3.0.0"
         susfsversion:
            description: "请输入 SUSFS 的版本号"
            required: true
            default: "2.0.0"
         kernelversion:
            description: "请输入内核版本号"
            required: true
            default: "4.14.356-openela-rc1"
         version:
            description: "请输入版本号"
            required: true
            default: "vX.X.X"

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix: 
        branch: ['main', 'ksunext', 'ksunext-susfs']
      fail-fast: false
    timeout-minutes: 45
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: 20G
      ARCH: arm64
      SUBARCH: arm
      KSU_VER: ${{ github.event.inputs.ksuversion || '3.0.0' }}
      SUSFS_VER: ${{ github.event.inputs.susfsversion || '2.0.0' }}
      KER_VER: ${{ github.event.inputs.kernelversion || '4.14.356-openela-rc1' }}

    steps:
    - name: Checkout ${{ matrix.branch }} branch Code
      uses: actions/checkout@v4
      with:
        ref: ${{ matrix.branch }}

    - name: Generate Dynamic Version
      run: |
        if [ -n "${{ github.event.inputs.version }}" ]; then
          echo "REL_VER=${{ github.event.inputs.version }}" >> $GITHUB_ENV
        else
          SHORT_SHA=$(git rev-parse --short HEAD)
          DATE_STR=$(date +'%y%m%d')
          echo "REL_VER=v${DATE_STR}" >> $GITHUB_ENV
        fi

    - name: Install Dependencies & toolchain
      run: |
        sudo apt update
        sudo apt install -y \
          build-essential \
          clang-14 \
          lld \
          libssl-dev \
          libelf-dev \
          flex \
          bison \
          bc \
          ccache \
          curl \
          git \
          git-lfs \
          gnupg \
          gperf \
          imagemagick \
          liblz4-tool \
          libncurses6 \
          libncurses5-dev \
          libsdl1.2-dev \
          libxml2 \
          libxml2-utils \
          lzop \
          pngcrush \
          rsync \
          schedtool \
          squashfs-tools \
          xsltproc \
          zip \
          zlib1g-dev \
          gcc-14-aarch64-linux-gnu \
          gcc-14-arm-linux-gnueabi \
          llvm-14 \
          llvm-14-tools
   
    - name: Set swap to 10G
      uses: pierotofy/set-swap-space@master
      with:
        swap-size-gb: 10

    - name: Configure ccache
      run: |
        mkdir -p $CCACHE_DIR
        echo "max_size = $CCACHE_MAXSIZE"
        sudo chmod -R 777 $CCACHE_DIR

    - name: Restore ccache
      uses: actions/cache@v3
      with:
        path: ${{ env.CCACHE_DIR }}
        key: kernel-ccache-${{ runner.os }}-${{ env.ARCH }}-${{ matrix.branch }}
    
    - name: Submodule init (only for ksunext and ksunext-susfs)
      run: |
        if [ ${{ matrix.branch }} == ksunext ] || [ ${{ matrix.branch }} == ksunext-susfs ]; then
          git submodule update --init
        fi
    
    - name: Build Kernel (ARM64 Cross-Compile)
      run: |
        make -j32 O=out \
          CC="ccache clang" \
          LD=ld.lld \
          CLANG_TRIPLE=aarch64-linux-gnu- \
          CROSS_COMPILE=aarch64-linux-gnu- \
          CROSS_COMPILE_COMPAT=aarch64-linux-gnueabi- \
          CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
          LLVM_IAS=1 \
          KCFLAGS="--target=aarch64-linux-gnu \
                   -Wno-unused-but-set-variable \
                   -Wno-implicit-function-declaration \
                   -Wno-unused-variable \
                   -Wno-unused-function \
                   -Wno-unused-label \
                   -Wno-incompatible-pointer-types" \
          evergo_defconfig

        if [ ${{ matrix.branch }} == ksunext-susfs ]; then
          VERSION="${{ env.REL_VER }}-ksunext-${{ env.KSU_VER }}-susfs-${{ env.SUSFS_VER }}"
        elif [ ${{ matrix.branch }} == ksunext ]; then
          VERSION="${{ env.REL_VER }}-ksunext-${{ env.KSU_VER }}"
        else
          VERSION="${{ env.REL_VER }}"
        fi

        echo "-${VERSION}" > .scmversion

        make -j32 O=out \
          CC="ccache clang" \
          LD=ld.lld \
          CLANG_TRIPLE=aarch64-linux-gnu- \
          CROSS_COMPILE=aarch64-linux-gnu- \
          CROSS_COMPILE_COMPAT=aarch64-linux-gnueabi- \
          CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
          LLVM_IAS=1 \
          KCFLAGS="--target=aarch64-linux-gnu \
                   -Wno-unused-but-set-variable \
                   -Wno-implicit-function-declaration \
                   -Wno-unused-variable \
                   -Wno-unused-function \
                   -Wno-unused-label \
                   -Wno-incompatible-pointer-types"

    - name: KPatch-Next (only for ksunext and ksunext-susfs)
      run: |
        if [ ${{ matrix.branch }} == ksunext ] || [ ${{ matrix.branch }} == ksunext-susfs ]; then
          wget -O kpimg https://github.com/KernelSU-Next/KPatch-Next/releases/latest/download/kpimg-linux
          wget -O kptools https://github.com/KernelSU-Next/KPatch-Next/releases/latest/download/kptools-linux
          chmod 777 kpimg kptools
          cp out/arch/arm64/boot/Image Image.old
          ./kptools -p -i Image.old -k kpimg -o Image
          cp -f Image out/arch/arm64/boot/Image
        fi

    - name: Package Kernel
      run: |
        git clone --depth=1 https://github.com/osm0sis/AnyKernel3.git AnyKernel3
        cp out/arch/arm64/boot/Image AnyKernel3/
        cd AnyKernel3

        sed -i 's/device\.name1=.*/device.name1=evergo/' anykernel.sh
        sed -i '/device\.name[2-5]=.*/d' anykernel.sh
        if [ ${{ matrix.branch }} == ksunext ]; then
          sed -i 's/kernel\.string=.*/kernel.string=Linux Kernel ${{ env.KER_VER }} (${{ env.REL_VER }}) patched KernelSU Next ${{ env.KSU_VER }} by 酷安@孤独不能/' anykernel.sh
        elif [ ${{ matrix.branch }} == ksunext-susfs ]; then
          sed -i 's/kernel\.string=.*/kernel.string=Linux Kernel ${{ env.KER_VER }} (${{ env.REL_VER }}) patched KernelSU Next ${{ env.KSU_VER }} and SUSFS ${{ env.SUSFS_VER }} by 酷安@孤独不能/' anykernel.sh
        else
          sed -i 's/kernel\.string=.*/kernel.string=Linux Kernel ${{ env.KER_VER }} (${{ env.REL_VER }}) by 酷安@孤独不能/' anykernel.sh
        fi
        sed -i 's/BLOCK=.*/BLOCK=boot/' anykernel.sh
        sed -i 's/IS_SLOT_DEVICE=.*/IS_SLOT_DEVICE=auto/' anykernel.sh
        
        if [ ${{ matrix.branch }} == ksunext ]; then
          zip -r ../AnyKernel3-evergo-${{ env.REL_VER }}-ksunext-${{ env.KSU_VER }}.zip *
        elif [ ${{ matrix.branch }} == ksunext-susfs ]; then
          zip -r ../AnyKernel3-evergo-${{ env.REL_VER }}-ksunext-${{ env.KSU_VER }}-susfs-${{ env.SUSFS_VER }}.zip *
        elif [ ${{ matrix.branch }} == main ]; then
          zip -r ../AnyKernel3-evergo-${{ env.REL_VER }}-main.zip *
        fi
        cd ..

    - name: Set Artifact File
      run: |
        FILE=$(ls AnyKernel3-evergo-*.zip | head -n 1)
        echo "Found artifact: $FILE"
        echo "ARTIFACT_FILE=$FILE" >> $GITHUB_ENV
        FILENAME=$(basename "$FILE" .zip)
        echo "ARTIFACT_NAME=$FILENAME" >> $GITHUB_ENV

    - name: Upload AnyKernel3.zip
      uses: actions/upload-artifact@v4
      with:
        path: ${{ env.ARTIFACT_FILE }}
        name: ${{ env.ARTIFACT_NAME }}

    - name: Install GitHub CLI
      run: sudo apt install -y gh

    - name: Delete old cache before saving new
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        echo "Deleting old cache (if exists)..."
        cache_id=$(gh cache list | grep -P "\bkernel-ccache-${{ runner.os }}-${{ env.ARCH }}-${{ matrix.branch }}\b(?!-)" | awk '{print $1}')
        if [ -n "$cache_id" ]; then
          gh cache delete "$cache_id" || true
        fi

    - name: Save ccache
      if: always()
      uses: actions/cache/save@v3
      with:
        path: ${{ env.CCACHE_DIR }}
        key: kernel-ccache-${{ runner.os }}-${{ env.ARCH }}-${{ matrix.branch }}
    
